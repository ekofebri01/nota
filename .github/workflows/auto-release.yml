name: Auto Build & Release APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.bin'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Jenis kenaikan versi'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - none
      release_notes:
        description: 'Catatan rilis tambahan (opsional, pisahkan baris untuk beberapa poin)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Tandai sebagai pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK, Update Changelog & Publish Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare version, changelog.md & whatsnew.json
        id: release_prep
        env:
          BUMP_MODE: ${{ github.event.inputs.bump_type || 'auto' }}
          CUSTOM_NOTES: ${{ github.event.inputs.release_notes || '' }}
        run: |
          python3 scripts/auto_release_notes.py \
            --bump "$BUMP_MODE" \
            --notes "$CUSTOM_NOTES" \
            --output-notes release_notes.md

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
              yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
            fi
          fi

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Prepare build keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Sign & verify APK (use Upload Key secret if configured)
        id: apk_output
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VERSION="${{ steps.release_prep.outputs.version }}"
          RAW_APK="app/build/outputs/apk/release/app-release.apk"
          OUT_APK="Nota-Kasir-Pro-v${VERSION}.apk"
          cp -f "$RAW_APK" "$OUT_APK"

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$APKSIGNER" ]; then
            CLEAN_STORE_PASS="$(printf '%s' "$SIGNING_STORE_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            CLEAN_KEY_PASS="$(printf '%s' "$SIGNING_KEY_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -z "$CLEAN_KEY_PASS" ]; then
              CLEAN_KEY_PASS="$CLEAN_STORE_PASS"
            fi
            CLEAN_KEY_ALIAS="$(printf '%s' "$SIGNING_KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > my-upload-key.jks
            "$APKSIGNER" sign \
              --ks my-upload-key.jks \
              --ks-pass "pass:${CLEAN_STORE_PASS}" \
              --ks-key-alias "${CLEAN_KEY_ALIAS}" \
              --key-pass "pass:${CLEAN_KEY_PASS}" \
              --out "$OUT_APK" \
              "$OUT_APK"
            rm -f my-upload-key.jks
            echo "signing_mode=upload-key" >> "$GITHUB_OUTPUT"
          else
            echo "signing_mode=debug-keystore-fallback" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$OUT_APK"
          fi
          ls -lh "$OUT_APK"
          echo "apk_file=$OUT_APK" >> "$GITHUB_OUTPUT"

      - name: Commit updated changelog.md, whatsnew.json & version
        if: steps.release_prep.outputs.has_repo_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
            app/src/main/java/com/eco/nota/models/NotaViewModel.kt \
            app/src/main/assets/whatsnew.json \
            changelog.md \
            README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${{ steps.release_prep.outputs.tag }} & update changelog/whatsnew [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || git pull --rebase
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Create or update GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_prep.outputs.tag }}"
          VERSION="${{ steps.release_prep.outputs.version }}"
          APK_FILE="${{ steps.apk_output.outputs.apk_file }}"
          PRERELEASE_FLAG=""
          if [ "${{ github.event.inputs.prerelease }}" == "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
            gh release edit "$TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" "$APK_FILE" \
              --title "Nota Kasir Pro $TAG" \
              --notes-file release_notes.md \
              $PRERELEASE_FLAG
          fi

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Nota-Kasir-Pro-${{ steps.release_prep.outputs.tag }}
          path: ${{ steps.apk_output.outputs.apk_file }}
          retention-days: 30
